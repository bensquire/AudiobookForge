name: Build (smoke)

# Unsigned smoke build to catch breakage on every push/PR. Tagged releases
# are handled by release.yml — skip this on tags to avoid wasted CI minutes.

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (unsigned)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: brew install xcodegen swiftformat swiftlint nasm pkg-config

      - name: Lint
        run: ./scripts/lint.sh

      - name: Cache bundled ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: AudiobookForge/Resources/bin
          # Key on the build script so any change (pinned version,
          # configure flags) busts the cache automatically.
          key: ffmpeg-arm64-${{ hashFiles('scripts/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg.sh

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: ./scripts/build.sh release

      - name: Build forge CLI
        run: |
          xcodebuild \
            -project AudiobookForge.xcodeproj \
            -scheme ForgeCLI \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          build/Build/Products/Release/forge --version

      - name: Test
        run: |
          xcodebuild \
            -project AudiobookForge.xcodeproj \
            -scheme AudiobookForge \
            -configuration Debug \
            -derivedDataPath build-test \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Zip .app for artifact
        run: |
          cd build/Build/Products/Release
          zip -ry "$GITHUB_WORKSPACE/AudiobookForge-unsigned.zip" AudiobookForge.app

      - uses: actions/upload-artifact@v4
        with:
          name: AudiobookForge-unsigned
          path: AudiobookForge-unsigned.zip
          retention-days: 7
