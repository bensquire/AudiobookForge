name: AudiobookForge
options:
  bundleIdPrefix: com.bensquire
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  # Headless core: probing, import rules, metadata, encoding, queue.
  # Shared by the GUI app and (from Phase 2 of the pipeline plan) the
  # forge CLI. No AppKit/SwiftUI in here.
  ForgeCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ForgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bensquire.ForgeCore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO

  AudiobookForge:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      - target: ForgeCore
        embed: true
    sources:
      - path: AudiobookForge
        excludes:
          - "Resources/bin/**"
      # type: folder makes Xcode treat this as a folder reference — its
      # contents are resolved at build time, not xcodegen time. That lets
      # us run `xcodegen generate` before `scripts/build-ffmpeg.sh` and
      # still get a populated bin/ inside the app at build time.
      - path: AudiobookForge/Resources/bin
        type: folder
        optional: true
        buildPhase: resources
    postBuildScripts:
      # The bundled Mach-O binary (ffmpeg) isn't auto-signed by
      # Xcode — only frameworks in known paths are. For notarization to
      # succeed each one must carry a hardened-runtime signature with a
      # secure timestamp. This script runs after Copy Resources and before
      # Xcode's final outer-bundle signing pass, so the inner signatures
      # get hashed into the outer signature.
      - name: Sign embedded helpers (hardened runtime)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          # Use CODESIGNING_FOLDER_PATH when Xcode set it (it's the bundle
          # actually being signed, which differs between `build` and
          # `archive` actions). Fall back to TARGET_BUILD_DIR for plain
          # builds, then BUILT_PRODUCTS_DIR as a last resort.
          APP_PATH="${CODESIGNING_FOLDER_PATH:-${TARGET_BUILD_DIR:-$BUILT_PRODUCTS_DIR}/$PRODUCT_NAME.app}"
          BIN_DIR="$APP_PATH/Contents/Resources/bin"
          if [ ! -d "$BIN_DIR" ]; then
            echo "no embedded bin/ at $BIN_DIR, nothing to sign"
            exit 0
          fi

          # Skip on ad-hoc / unsigned debug builds — hardened runtime + a
          # secure timestamp both require a real Developer ID identity.
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ] \
             || [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] \
             || [ "${EXPANDED_CODE_SIGN_IDENTITY}" = "-" ]; then
            echo "skipping embedded-binary signing (ad-hoc / unsigned build)"
            exit 0
          fi

          for bin in "$BIN_DIR"/*; do
            [ -f "$bin" ] || continue
            echo "==> signing $(basename "$bin") with hardened runtime"
            /usr/bin/codesign --force \
              --options runtime \
              --timestamp \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$bin"
          done
    info:
      path: AudiobookForge/Info.plist
      properties:
        CFBundleName: AudiobookForge
        CFBundleDisplayName: AudiobookForge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Ben Squire"
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: AudiobookForge/AudiobookForge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # SettingsStore persists the output folder as a security-scoped
        # bookmark so the write grant survives relaunch in sandboxed
        # builds.
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: AudiobookForge
        PRODUCT_BUNDLE_IDENTIFIER: com.bensquire.AudiobookForge
        # arm64 only. The bundled ffmpeg is arm64-only too (see
        # scripts/build-ffmpeg.sh) so there's no x86_64 path that could
        # ever run end-to-end. Saves ~half the bundle size.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        GENERATE_INFOPLIST_FILE: NO
        # User-script sandbox blocks our post-build signing script from
        # reading Resources/bin/* even though it lives inside the bundle.
        # The scripts are first-party and already vetted, so the sandbox
        # adds friction without a real security win for this project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - AudiobookForgeTests

  AudiobookForgeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AudiobookForgeTests
    dependencies:
      - target: AudiobookForge
      - target: ForgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bensquire.AudiobookForgeTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
