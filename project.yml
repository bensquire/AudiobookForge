name: AudiobookForge
options:
  bundleIdPrefix: com.bensquire
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: AudiobookForge

targets:
  AudiobookForge:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AudiobookForge
        excludes:
          - "Resources/bin/**"
      # type: folder makes Xcode treat this as a folder reference — its
      # contents are resolved at build time, not xcodegen time. That lets
      # us run `xcodegen generate` before `scripts/fetch-ffmpeg.sh` and
      # still get a populated bin/ inside the app at build time.
      - path: AudiobookForge/Resources/bin
        type: folder
        optional: true
        buildPhase: resources
    info:
      path: AudiobookForge/Info.plist
      properties:
        CFBundleName: AudiobookForge
        CFBundleDisplayName: AudiobookForge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Ben Squire"
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: AudiobookForge/AudiobookForge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bensquire.AudiobookForge
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
