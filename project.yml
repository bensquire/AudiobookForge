name: AudiobookForge
options:
  bundleIdPrefix: com.bensquire
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Swift 6 language mode: data-race safety is enforced as errors on
    # every target. The deliberate carve-outs are the `nonisolated(unsafe)`
    # markers on Bundled's lock-guarded statics, two immutable `Regex`
    # constants, and the XCTest fixtures mutated from nonisolated
    # setUp/tearDown.
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Expanded by xcodegen from the shell when set (export it before
    # `xcodegen generate` to build the sandboxed app from Xcode without
    # re-picking a team after every regenerate). Unset → empty, which is
    # fine for the ad-hoc / unsigned script builds. CI and release.sh
    # pass DEVELOPMENT_TEAM explicitly on the xcodebuild command line.
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"

# Pinned exactly: Package.resolved is gitignored (the xcodeproj is
# generated), so `from:` would let every CI release re-resolve to
# whatever upstream shipped that morning. Bump deliberately.
packages:
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    exactVersion: 1.8.2
  Yams:
    url: https://github.com/jpsim/Yams
    exactVersion: 6.2.2

targets:
  # Headless core: probing, import rules, metadata, encoding, queue.
  # Shared by the GUI app and the forge CLI. No AppKit/SwiftUI in here.
  # Static so the CLI links it into a single relocatable binary — no
  # framework-embedding for a command-line tool.
  ForgeCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ForgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bensquire.ForgeCore
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        MACH_O_TYPE: staticlib
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO

  # Batch pipeline CLI: scan (classify the library) now; plan/run/verify
  # in later phases. See the pipeline plan in .claude + memory.
  ForgeCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ForgeCLI
    dependencies:
      - target: ForgeCore
      - package: ArgumentParser
      - package: Yams
    settings:
      base:
        PRODUCT_NAME: forge
        SWIFT_EMIT_LOC_STRINGS: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        # Embed a generated Info.plist in the binary's __TEXT segment so
        # `forge --version` reads MARKETING_VERSION instead of carrying
        # its own copy of the number.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

  AudiobookForge:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    dependencies:
      # embed:false — ForgeCore is a static archive, its code links
      # directly into each consumer.
      - target: ForgeCore
        embed: false
    sources:
      - path: AudiobookForge
        excludes:
          - "Resources/bin/**"
      # type: folder makes Xcode treat this as a folder reference — its
      # contents are resolved at build time, not xcodegen time. That lets
      # us run `xcodegen generate` before `scripts/build-ffmpeg.sh` and
      # still get a populated bin/ inside the app at build time.
      - path: AudiobookForge/Resources/bin
        type: folder
        optional: true
        buildPhase: resources
    postBuildScripts:
      # The bundled Mach-O binary (ffmpeg) isn't auto-signed by
      # Xcode — only frameworks in known paths are. For notarization to
      # succeed each one must carry a hardened-runtime signature with a
      # secure timestamp. This script runs after Copy Resources and before
      # Xcode's final outer-bundle signing pass, so the inner signatures
      # get hashed into the outer signature.
      - name: Sign embedded helpers (hardened runtime)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          # Use CODESIGNING_FOLDER_PATH when Xcode set it (it's the bundle
          # actually being signed, which differs between `build` and
          # `archive` actions). Fall back to TARGET_BUILD_DIR for plain
          # builds, then BUILT_PRODUCTS_DIR as a last resort.
          APP_PATH="${CODESIGNING_FOLDER_PATH:-${TARGET_BUILD_DIR:-$BUILT_PRODUCTS_DIR}/$PRODUCT_NAME.app}"
          BIN_DIR="$APP_PATH/Contents/Resources/bin"
          if [ ! -d "$BIN_DIR" ]; then
            echo "no embedded bin/ at $BIN_DIR, nothing to sign"
            exit 0
          fi

          # Skip on ad-hoc / unsigned debug builds — hardened runtime + a
          # secure timestamp both require a real Developer ID identity.
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ] \
             || [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] \
             || [ "${EXPANDED_CODE_SIGN_IDENTITY}" = "-" ]; then
            echo "skipping embedded-binary signing (ad-hoc / unsigned build)"
            exit 0
          fi

          for bin in "$BIN_DIR"/*; do
            [ -f "$bin" ] || continue
            echo "==> signing $(basename "$bin") with hardened runtime"
            /usr/bin/codesign --force \
              --options runtime \
              --timestamp \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
              "$bin"
          done
    info:
      path: AudiobookForge/Info.plist
      properties:
        CFBundleName: AudiobookForge
        CFBundleDisplayName: AudiobookForge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 Ben Squire"
        LSApplicationCategoryType: public.app-category.music
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: AudiobookForge/AudiobookForge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # SettingsStore persists the output folder as a security-scoped
        # bookmark so the write grant survives relaunch in sandboxed
        # builds.
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_NAME: AudiobookForge
        PRODUCT_BUNDLE_IDENTIFIER: com.bensquire.AudiobookForge
        # arm64 only. The bundled ffmpeg is arm64-only too (see
        # scripts/build-ffmpeg.sh) so there's no x86_64 path that could
        # ever run end-to-end. Saves ~half the bundle size.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        GENERATE_INFOPLIST_FILE: NO
        # User-script sandbox blocks our post-build signing script from
        # reading Resources/bin/* even though it lives inside the bundle.
        # The scripts are first-party and already vetted, so the sandbox
        # adds friction without a real security win for this project.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - AudiobookForgeTests

  # Links ForgeCore directly and is NOT hosted in the app. Hosting would
  # link the static archive twice (once in the app, once here) — two
  # copies of every static cache and an ObjC "class implemented in both"
  # warning at launch. Nothing under test needs AppKit or the bundle.
  AudiobookForgeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AudiobookForgeTests
    dependencies:
      - target: ForgeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bensquire.AudiobookForgeTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
